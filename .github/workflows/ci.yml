name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - run: npm ci

      # Una sola definición de la calidad: compila, checks, smoke LSP, mocha y autogate (ver package.json).
      # Falla en el propio paso; sin continue-on-error ni fallo diferido.
      - name: Calidad y tests
        id: calidad
        run: |
          set -o pipefail
          npm run quality:check 2>&1 | tee quality-output.log

      # Solo si la calidad falla: extrae los tests fallidos para el resumen y los adjunta.
      - name: Diagnósticos de fallo
        if: failure() && steps.calidad.outcome == 'failure'
        run: |
          set +e
          npx mocha --reporter json --full-trace > mocha-json.log 2>&1
          set -e
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const raw = fs.readFileSync('mocha-json.log', 'utf8');
          const marker = raw.lastIndexOf('\n{\n  "stats"');
          let report = null;
          if (marker >= 0) {
            try {
              report = JSON.parse(raw.slice(marker + 1));
            } catch (error) {
              console.log(`::warning::No se pudo parsear el JSON de Mocha: ${error.message}`);
            }
          }
          const failures = report?.failures ?? [];
          const lines = failures.map((failure) => {
            const file = failure.file ? path.relative(process.cwd(), failure.file) : '';
            const line = failure.err?.line || 1;
            const message = `${failure.fullTitle}: ${failure.err?.message || 'fallo sin mensaje'}`
              .replaceAll(/\r?\n/gu, ' ')
              .replaceAll('::', ':');
            console.log(`::error file=${file},line=${line}::${message}`);
            return `- **${failure.fullTitle}** — ${failure.err?.message || 'fallo sin mensaje'}`;
          });
          const summary = [
            '## Unit-test failures',
            '',
            lines.length ? lines.join('\n') : 'No se pudo extraer la lista estructurada; revisar `mocha-json.log`.',
            '',
            `Tests: ${report?.stats?.tests ?? 'desconocidos'}; fallos: ${report?.stats?.failures ?? 'desconocidos'}`,
          ].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary}\n`);
          NODE
          {
            echo '## Calidad: salida (últimas 300 líneas)'
            echo
            echo '```text'
            tail -n 300 quality-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Subir diagnósticos de fallo
        if: failure() && steps.calidad.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-diagnostics
          path: |
            quality-output.log
            mocha-json.log
          if-no-files-found: ignore

      - run: npm run check:zed
